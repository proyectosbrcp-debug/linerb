name: linerb
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^14.0.3
  image_picker: ^1.2.2
  pdf: ^3.12.0
  printing: ^5.14.3
  shared_preferences: ^2.5.5
  http: ^1.2.1
  sqflite: ^2.4.3
  path: ^1.9.1
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.1.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2

flutter:
  uses-material-design: true

  assets:
    - assets/logo_linerb.png
    - assets/footer_linerb.png
    - assets/footer_linerb-1.png
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
    - assets/data/
